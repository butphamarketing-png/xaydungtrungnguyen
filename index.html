    <style>
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 45%, #ffffff 0%, #eef4fc 70%);
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #page-loader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      .loader-box {
        display: grid;
        justify-items: center;
        gap: 18px;
      }
      .loader-ring {
        position: relative;
        width: 132px;
        height: 132px;
        display: grid;
        place-items: center;
      }
      .loader-ring::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(26, 79, 156, 0.12);
        border-top-color: #1a4f9c;
        border-right-color: #c6a15b;
        animation: loader-spin 1s linear infinite;
      }
      .loader-ring img {
        width: 104px;
        height: 104px;
        border-radius: 50%;
        animation: loader-pulse 1.6s ease-in-out infinite;
      }
      .loader-name {
        margin: 0;
        color: #0c2348;
        font: 700 15px/1.3 "Be Vietnam Pro", system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .loader-bar {
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(26, 79, 156, 0.12);
      }
      .loader-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #1a4f9c;
        animation: loader-slide 1.2s ease-in-out infinite;
      }
      @keyframes loader-spin { to { transform: rotate(360deg); } }
      @keyframes loader-pulse { 50% { transform: scale(0.94); } }
      @keyframes loader-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        .loader-ring::before, .loader-ring img, .loader-bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="page-loader" role="status" aria-label="Đang tải trang">
      <div class="loader-box">
        <div class="loader-ring"><img src="/logo-menu.png" alt="" width="104" height="104" /></div>
        <p class="loader-name">Xây Dựng Trung Nguyễn</p>
        <div class="loader-bar"></div>
      </div>
    </div>
    <script>
      (function () {
        var start = Date.now();
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          var el = document.getElementById("page-loader");
          if (!el) return;
          setTimeout(function () {
            el.classList.add("is-done");
            setTimeout(function () { el.remove(); }, 600);
          }, Math.max(0, 700 - (Date.now() - start)));
        }
        if (document.readyState === "complete") hide();
        else window.addEventListener("load", hide);
        setTimeout(hide, 5000);
      })();
    </script>
    <script>
      document.addEventListener("error", function (e) {
        const el = e.target;
        if (!el || el.tagName !== "IMG") return;
        const src = el.currentSrc || el.src || "";
        if (!el.dataset.cmsRetry && /vietdungphat\.com/i.test(src) && !/images\.weserv\.nl/i.test(src)) {
          el.dataset.cmsRetry = "1";
          el.src =
            "https://images.weserv.nl/?url=" +
            encodeURIComponent(src.replace(/^https?:\/\//i, "")) +
            "&default=" +
            encodeURIComponent("www.vietdungphat.com/studio/01.jpg");
          return;
        }
        if (el.dataset.ph !== "1" && !/\/studio\/01\.jpg/i.test(src)) {
          el.dataset.ph = "1";
          el.src = "/studio/01.jpg";
        }
      }, true);
    </script>
