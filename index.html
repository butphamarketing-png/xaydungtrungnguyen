    <style>
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: linear-gradient(180deg, #f4f8fd 0%, #ffffff 55%, #eaf1fa 100%);
        font-family: "Be Vietnam Pro", system-ui, sans-serif;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #page-loader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      .loader-side {
        position: absolute;
        top: 0;
        bottom: 0;
        width: min(36vw, 560px);
        background-size: cover;
        pointer-events: none;
      }
      .loader-side.left {
        left: 0;
        background-image: url("/loader-left.jpg");
        background-position: right center;
        opacity: 0.85;
        -webkit-mask-image: linear-gradient(90deg, #000 55%, transparent);
        mask-image: linear-gradient(90deg, #000 55%, transparent);
      }
      .loader-side.right {
        right: 0;
        background-image: url("/loader-right.jpg");
        background-position: left center;
        -webkit-mask-image: linear-gradient(270deg, #000 55%, transparent);
        mask-image: linear-gradient(270deg, #000 55%, transparent);
      }
      .loader-box {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        padding: 0 20px;
        text-align: center;
      }
      .loader-logo {
        width: 132px;
        height: 132px;
        border-radius: 50%;
        box-shadow: 0 10px 30px rgba(12, 35, 72, 0.18);
        animation: loader-pulse 1.8s ease-in-out infinite;
      }
      .loader-company {
        margin: 26px 0 4px;
        color: #0c2348;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .loader-brand {
        margin: 0;
        padding-top: 0.18em;
        font-size: 52px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: 0.02em;
        background: linear-gradient(180deg, #f3d98a 0%, #c6a15b 45%, #9a7531 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 2px 2px rgba(12, 35, 72, 0.25));
      }
      .loader-slogan {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 6px 0 0;
        color: #1a4f9c;
        font-size: 18px;
        font-style: italic;
        font-weight: 500;
      }
      .loader-slogan::before,
      .loader-slogan::after {
        content: "";
        width: 70px;
        height: 1px;
        background: #c6a15b;
      }
      .loader-bar {
        width: min(360px, 78vw);
        height: 10px;
        margin-top: 44px;
        overflow: hidden;
        border-radius: 10px;
        background: #dfe6ef;
      }
      .loader-bar::after {
        content: "";
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 10px;
        background: linear-gradient(90deg, #1a4f9c, #3d8bf2);
        transform-origin: left;
        animation: loader-fill 3s cubic-bezier(0.3, 0.6, 0.4, 1) forwards;
      }
      .loader-text {
        margin: 16px 0 0;
        color: #0c2348;
        font-size: 15px;
        font-weight: 500;
      }
      @keyframes loader-pulse { 50% { transform: scale(0.95); } }
      @keyframes loader-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (max-width: 760px) {
        .loader-side { width: 46vw; opacity: 0.35; }
        .loader-side.left { opacity: 0.3; }
        .loader-logo { width: 100px; height: 100px; }
        .loader-company { font-size: 13px; margin-top: 20px; }
        .loader-brand { font-size: 32px; }
        .loader-slogan { font-size: 14px; gap: 10px; }
        .loader-slogan::before,
        .loader-slogan::after { width: 32px; }
        .loader-bar { margin-top: 32px; height: 8px; }
        .loader-text { font-size: 13px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-logo { animation: none; }
      }
    </style>

    <div id="page-loader" role="status" aria-label="Đang tải trang">
      <div class="loader-side left"></div>
      <div class="loader-side right"></div>
      <div class="loader-box">

        <p class="loader-company">CÔNG TY TNHH XÂY DỰNG VÀ ĐIỆN LẠNH</p>
        <p class="loader-brand">TRUNG NGUYỄN</p>
        <p class="loader-slogan">Uy tín tạo nên giá trị bền vững</p>
        <div class="loader-bar"></div>
        <p class="loader-text">Đang tải website...</p>
      </div>
    </div>
    <script>
      (function () {
        var start = Date.now();
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          var el = document.getElementById("page-loader");
          if (!el) {
            window.__loaderDone = true;
            return;
          }
          setTimeout(function () {
            el.classList.add("is-done");
            window.__loaderDone = true;
            window.dispatchEvent(new Event("page-loader-done"));
            setTimeout(function () { el.remove(); }, 600);
          }, Math.max(0, 3000 - (Date.now() - start)));
        }
        if (document.readyState === "complete") hide();
        else window.addEventListener("load", hide);
        setTimeout(hide, 6000);
      })();
    </script>
    <script>
      document.addEventListener("error", function (e) {
        const el = e.target;
        if (!el || el.tagName !== "IMG") return;
        const src = el.currentSrc || el.src || "";
        if (!el.dataset.cmsRetry && /vietdungphat\.com/i.test(src) && !/images\.weserv\.nl/i.test(src)) {
          el.dataset.cmsRetry = "1";
          el.src =
            "https://images.weserv.nl/?url=" +
            encodeURIComponent(src.replace(/^https?:\/\//i, "")) +
            "&default=" +
            encodeURIComponent("www.vietdungphat.com/studio/01.jpg");
          return;
        }
        if (el.dataset.ph !== "1" && !/\/studio\/01\.jpg/i.test(src)) {
          el.dataset.ph = "1";
          el.src = "/studio/01.jpg";
        }
      }, true);
    </script>
